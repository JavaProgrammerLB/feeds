[default]
onFail = "stale"

[limboy]
title = "limboy blog"
url = "https://limboy.me/posts"
entrySelector = ".article-list .article-item[data-type='post']"
titleSelector = "span.line-clamp-1"
linkSelector = "*"
dateSelector = "time"
dateFormat = "yyyy-MM-dd"

[yihong]
url = "https://blog.yihong0618.me/"
title = "Yihong’s Blog"
entrySelector = "article.post"
titleSelector = "h1.post__title a"
linkSelector = "h1.post__title a"
dateSelector = "span.post__time"
dateFormat = "yyyy-MM-dd"

[frostming]
url = "https://frostming.com/"
title = "Frost Ming — Blog"
# Use semantic article tags which are more stable than Tailwind utility classes
entrySelector = "article"
# The post link is an <a href="/posts/..."> inside each <article>
titleSelector = "a[href^='/posts/']"
linkSelector = "a[href^='/posts/']"
# Use time tag for more reliable date extraction
dateSelector = "time"
dateFormat = "yyyy-MM-dd"
# Wait for JS-rendered content to load
waitUntil = "networkidle"
waitForSelector = "article"

[TakuyaMatsuyama]
url = "https://www.devas.life/"
title = "Takuya Matsuyama — Blog"
# Each post card is an <article> with a single wrapper <a>, an <h3> title, and a <time> like "15 Oct 2025"
entrySelector = "article"
titleSelector = "h3"
linkSelector = "a"
dateSelector = "time"
dateFormat = "dd MMM yyyy"

[idoubi]
# English /blog currently has no posts; Chinese listing is the live index.
url = "https://idoubi.ai/zh/blog"
title = "idoubi.ai — Blog"
entrySelector = "a[href^='/zh/blog/']"
titleSelector = "h3"
linkSelector = "*"
contentSelector = "p.line-clamp-3"
# Date sits in the first inline-flex span inside the card footer (avoid gap-1.5 — invalid CSS).
dateSelector = "div.mt-auto > span.inline-flex:first-child"
dateFormat = "yyyy年M月d日"
waitUntil = "load"
waitForSelector = "a[href^='/zh/blog/']"

[turbek]
url = "https://turbek.com/"
title = "Steve Turbek — Blog"
# Homepage lists many items (projects, press, etc.); include only those linking to /blog/...
entrySelector = "div.wide-item:has(a.item-link[href^='/blog/'])"
titleSelector = "a.item-link h2"
linkSelector = "a.item-link"
contentSelector = "div.item-desc p"
dateSelector = "span.item-date"
dateFormat = "d MMM yyyy"

[byvoid]
url = "https://byvoid.com/zhs/blog/archive/"
title = "Beyond the Void — BYVoid"
entrySelector = "table tr"
titleSelector = "a"
linkSelector = "a"
dateSelector = "td:first-child"
dateFormat = "yyyy-MM-dd"

[littlecheesecake]
url = "https://littlecheesecake.me/money.sense/cn/posts/"
title = "LittleCheeseCake MoneySense"
entrySelector = "li.post-list-item"
titleSelector = "h3.post-list-item-title"
linkSelector = "a.post-list-item-link"
contentSelector = "p.post-list-item-description"
dateSelector = "div.post-list-item-meta"
dateFormat = "MMMM d, yyyy"
